name: 'Maida Accept Command'
description: 'Authorize acceptance without checking out or executing candidate code'
inputs:
  stage:
    description: 'Must be authorize; migrate old single-job handlers to the three-job README workflow'
    required: true
  baseline:
    description: 'Tracked baseline JSON file to accept'
    required: true
  policy:
    description: 'Policy path, required unchanged from the PR base'
    default: '.maida/policy.yaml'
  github-token:
    description: 'Token with contents read and pull-requests write permission for authorization replies'
    required: true
outputs:
  authorized:
    description: 'Whether the commenter and PR were authorized'
    value: '${{ steps.prepare.outputs.authorized }}'
  context:
    description: 'Trusted authorization binding; pass directly to the write job through needs'
    value: '${{ steps.prepare.outputs.context }}'
  head-sha:
    description: 'Authorized candidate commit'
    value: '${{ steps.prepare.outputs.head-sha }}'
runs:
  using: composite
  steps:
    - name: Parse and authorize command
      id: prepare
      shell: bash
      env:
        GITHUB_TOKEN: '${{ inputs.github-token }}'
        MAIDA_STAGE: '${{ inputs.stage }}'
        MAIDA_BASELINE: '${{ inputs.baseline }}'
        MAIDA_POLICY: '${{ inputs.policy }}'
        MAIDA_ACCEPT_ACTION_PATH: '${{ github.action_path }}'
      run: |
        if [ "$MAIDA_STAGE" != authorize ] || [ -z "$MAIDA_POLICY" ]; then
          echo 'Use stage: authorize in a separate job; migrate to the three-job acceptance workflow in README.md.'
          exit 2
        fi
        python3 -I "$MAIDA_ACCEPT_ACTION_PATH/../scripts/accept_command.py" \
          prepare --baseline "$MAIDA_BASELINE" --policy "$MAIDA_POLICY"
