name: 'Maida Baseline Write-Back'
description: 'Write verified baseline data from a fresh trusted job; never execute candidate code here'
inputs:
  context:
    description: 'Trusted context directly from needs.authorize.outputs.context, never a capture output'
    required: true
  artifact-directory:
    description: 'Directory containing only acceptance.json downloaded from this workflow attempt'
    required: true
  github-token:
    description: 'Token with contents write and pull-requests write permission'
    required: true
outputs:
  changed:
    description: 'Whether a new baseline commit was created'
    value: '${{ steps.write-back.outputs.changed }}'
  commit-sha:
    description: 'Created baseline commit SHA, or empty when unchanged'
    value: '${{ steps.write-back.outputs.commit-sha }}'
  head-sha:
    description: 'PR head SHA sent to the fresh-gate dispatch'
    value: '${{ steps.write-back.outputs.head-sha }}'
runs:
  using: composite
  steps:
    - name: Write verified baseline data
      id: write-back
      shell: bash
      env:
        GITHUB_TOKEN: '${{ inputs.github-token }}'
        MAIDA_ACCEPT_CONTEXT: '${{ inputs.context }}'
        MAIDA_ARTIFACT_DIRECTORY: '${{ inputs.artifact-directory }}'
        MAIDA_WRITE_BACK_ACTION_PATH: '${{ github.action_path }}'
      run: |
        if [ -z "$MAIDA_ACCEPT_CONTEXT" ] || [ -z "$MAIDA_ARTIFACT_DIRECTORY" ]; then
          echo 'Migrate to the three-job acceptance workflow in README.md; a trusted context and captured artifact are required.'
          exit 2
        fi
        python3 -I "$MAIDA_WRITE_BACK_ACTION_PATH/../scripts/accept_artifact.py" \
          --artifact-directory "$MAIDA_ARTIFACT_DIRECTORY"
    - name: Report command result
      if: always()
      shell: bash
      env:
        GITHUB_TOKEN: '${{ inputs.github-token }}'
        WRITE_BACK_OUTCOME: '${{ steps.write-back.outcome }}'
        WRITE_BACK_CHANGED: '${{ steps.write-back.outputs.changed }}'
        WRITE_BACK_COMMIT_SHA: '${{ steps.write-back.outputs.commit-sha }}'
        WRITE_BACK_HEAD_SHA: '${{ steps.write-back.outputs.head-sha }}'
        MAIDA_WRITE_BACK_ACTION_PATH: '${{ github.action_path }}'
      run: |
        python3 -I "$MAIDA_WRITE_BACK_ACTION_PATH/../scripts/accept_command.py" finalize \
          --outcome "$WRITE_BACK_OUTCOME" --changed "$WRITE_BACK_CHANGED" \
          --commit-sha "$WRITE_BACK_COMMIT_SHA" --head-sha "$WRITE_BACK_HEAD_SHA"
