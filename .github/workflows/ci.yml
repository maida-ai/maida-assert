name: CI

on:
  push:
    branches: [main]
    paths: &test_paths
      - .maida/**
      - .github/workflows/**
      - .github/dependabot.yml
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - SECURITY.md
      - docs/**
      - action.yml
      - accept-command/**
      - capture-acceptance/**
      - pr-context/**
      - publish-status/**
      - examples/**
      - pyproject.toml
      - uv.lock
      - scripts/**
      - tests/**
      - write-back/**
  pull_request:
    paths: *test_paths

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'push' ||
        github.event.pull_request.base.ref == 'main' ||
        github.event.pull_request.head.repo.full_name == github.repository
      }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: 'false'
      - name: Install dev dependencies
        run: |
          uv sync --locked --only-group dev --no-build --python "${{ matrix.python-version }}"

      - name: Run tests
        run: uv run --locked --no-sync pytest -q --ignore=tests/e2e

  integration:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event.pull_request.base.ref == 'main' ||
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Uses the local composite action (./action.yml) so CI always
      # tests the version checked into this branch.
      - uses: ./
        with:
          agent-script: examples/ci_dummy_agent.py
          policy: .maida/policy.yaml
          maida-version: 'v0.6.1'
          mode: ${{ github.event_name == 'pull_request' && 'blocking' || 'report-only' }}
          post-comment: 'true'
