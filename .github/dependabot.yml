version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /accept-command
      - /capture-acceptance
      - /pr-context
      - /publish-status
      - /write-back
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
