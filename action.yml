name: 'Maida Assert'
description: 'Run Maida behavioral regression checks on agent traces'
inputs:
  mode:
    description: 'blocking evaluates trusted PR base policy and requires decisive evidence; report-only never authorizes merge.'
    required: false
    default: 'blocking'
  configuration-acceptance:
    description: 'Maintainer-controlled base-SHA:head-SHA:configuration-SHA256 acceptance; never source from PR content.'
    required: false
    default: ''
  agent-script:
    description: 'Python script that runs the agent (must use @trace). Pass exactly one trace source.'
    required: false
    default: ''
  trace-command:
    description: 'Trusted shell command that creates exactly one completed Maida run. Pass exactly one trace source.'
    required: false
    default: ''
  baseline:
    description: 'Path to baseline JSON file. If omitted, only the policy is enforced.'
    required: false
    default: ''
  policy:
    description: 'Repository-relative policy path, read from the PR base revision in blocking mode.'
    required: false
    default: '.maida/policy.yaml'
  maida-version:
    description: |
      Maida version to use.
      Could be a version number starting with 'v' or a branch name starting with '@'.
      If a github identifier starts with 'v', use '@' prefix.
      Otherwise PyPI will be used. Default is "v0.5.3".
    required: false
    default: 'v0.5.3'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  extra-args:
    description: 'Additional maida run arguments in report-only mode; forbidden in blocking mode.'
    required: false
    default: ''
  post-comment:
    description: 'Post results as PR comment (true/false)'
    required: false
    default: 'true'
  accept-command-enabled:
    description: 'Advertise /maida accept in failed baseline reports (true/false)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Validate trace source, baseline, and policy
      env:
        AGENT_SCRIPT: ${{ inputs.agent-script }}
        TRACE_COMMAND: ${{ inputs.trace-command }}
        BASELINE: ${{ inputs.baseline }}
        POLICY: ${{ inputs.policy }}
      shell: bash
      run: |
        if { [ -z "$AGENT_SCRIPT" ] && [ -z "$TRACE_COMMAND" ]; } || \
           { [ -n "$AGENT_SCRIPT" ] && [ -n "$TRACE_COMMAND" ]; }; then
          echo "Pass exactly one of agent-script or trace-command."
          exit 2
        fi

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Resolve trusted evaluation inputs
      id: trust
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        POLICY: ${{ inputs.policy }}
        BASELINE: ${{ inputs.baseline }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        CONFIGURATION_ACCEPTANCE: ${{ inputs.configuration-acceptance }}
      run: python "$GITHUB_ACTION_PATH/scripts/resolve_inputs.py"

    - name: Install Maida
      env:
        MAIDA_REPO: 'https://github.com/maida-ai/maida.git'
        MAIDA_VERSION: '${{ inputs.maida-version }}'
      shell: bash
      run: |
        if [[ "${MAIDA_VERSION}" == "@"* ]]; then
          # GitHub identifier
          python -m pip install "git+${MAIDA_REPO}${MAIDA_VERSION}"
        elif [[ "${MAIDA_VERSION}" == "v"* ]]; then
          # PyPI version number
          python -m pip install "maida-ai==${MAIDA_VERSION:1}"
        else
          # Let's not allow any other values
          echo "Invalid maida-version: ${MAIDA_VERSION}."
          echo "Maida version must start with 'v' for PyPI version number"
          echo "or '@' for GitHub identifier."
          exit 10
        fi

    - name: Run Maida statistical gate
      shell: bash
      id: gate
      env:
        MODE: ${{ inputs.mode }}
        AGENT_SCRIPT: ${{ inputs.agent-script }}
        TRACE_COMMAND: ${{ inputs.trace-command }}
        BASELINE: ${{ steps.trust.outputs.baseline }}
        POLICY: ${{ steps.trust.outputs.policy }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        ARGS=()
        if [ -n "$BASELINE" ]; then
          ARGS+=(--baseline "$BASELINE")
        fi
        if [ -f "$POLICY" ]; then
          ARGS+=(--policy "$POLICY")
        fi
        if [ -n "$EXTRA_ARGS" ]; then
          read -r -a EXTRA_ARGV <<< "$EXTRA_ARGS"
          if [ -n "$TRACE_COMMAND" ]; then
            for arg in "${EXTRA_ARGV[@]}"; do
              if [ "$arg" = "--trials" ] || [[ "$arg" == --trials=* ]]; then
                echo "trace-command mode fixes --trials at 1; remove --trials from extra-args."
                exit 2
              fi
            done
          fi
          ARGS+=("${EXTRA_ARGV[@]}")
        fi
        RUN_TARGET="$AGENT_SCRIPT"
        if [ -n "$TRACE_COMMAND" ]; then
          export MAIDA_TRACE_COMMAND="$TRACE_COMMAND"
          export MAIDA_DATA_DIR="$(mktemp -d "$RUNNER_TEMP/maida-trace-command.XXXXXX")"
          RUN_TARGET="$(mktemp "$GITHUB_WORKSPACE/maida_trace_command_runner.XXXXXX")"
          trap 'rm -f -- "$RUN_TARGET"' EXIT
          cp "$GITHUB_ACTION_PATH/scripts/run_trace_command.py" "$RUN_TARGET"
          if git check-ignore --quiet "$RUN_TARGET"; then
            echo "The temporary trace-command runner is ignored by Git; choose repository ignore rules that allow the generated runner."
            exit 10
          fi
          if [ "$MODE" = "blocking" ]; then
            python - <<'PYTHON'
        import os
        from pathlib import Path
        from maida.policy import load_policy
        if load_policy(Path(os.environ["POLICY"])).trials != 1:
            raise SystemExit("Blocking trace-command requires trials: 1 in the trusted base policy; use agent-script for multi-trial policies.")
        PYTHON
          fi
          ARGS+=(--trials 1)
        fi
        # Never consume a sidecar left by a previous invocation.
        : > maida-report.json
        set +e
        maida run "$RUN_TARGET" "${ARGS[@]}" \
          --format markdown --json-out maida-report.json > maida-report.md
        status=$?
        set -e
        echo "status=$status" >> "$GITHUB_OUTPUT"
        if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
          echo "maida run exited with code $status and did not produce a statistical gate report."
          echo "Ensure the selected trace source records exactly one completed Maida run per trial."
          exit "$status"
        fi

    - name: Prepare GitHub check
      id: check
      shell: bash
      env:
        HEAD_SHA: ${{ steps.trust.outputs.head_sha }}
        MODE: ${{ inputs.mode }}
        CONTEXT: ${{ steps.trust.outputs.context }}
        CLI_STATUS: ${{ steps.gate.outputs.status }}
        DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        python "$GITHUB_ACTION_PATH/scripts/prepare_check.py" \
          --report maida-report.json \
          --output maida-check-payload.json \
          --head-sha "$HEAD_SHA" \
          --mode "$MODE" --context "$CONTEXT" --markdown maida-report.md --cli-status "$CLI_STATUS" \
          --details-url "$DETAILS_URL" >> "$GITHUB_OUTPUT"

    - name: Add local reproduction hint
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BASE_SHA: ${{ steps.trust.outputs.base_sha }}
        BASELINE_REVISION: ${{ steps.trust.outputs.baseline_revision }}
        AGENT_SCRIPT: ${{ inputs.agent-script }}
        TRACE_COMMAND: ${{ inputs.trace-command }}
        BASELINE: ${{ inputs.baseline }}
        POLICY: ${{ inputs.policy }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        MAIDA_VERSION: ${{ inputs.maida-version }}
        ACCEPT_COMMAND_ENABLED: ${{ inputs.accept-command-enabled }}
      run: |
        {
          echo ""
          echo "---"
          echo ""
          if [ "$ACCEPT_COMMAND_ENABLED" = "true" ] && [ -n "$BASELINE" ]; then
            echo "### Accept this intentional change"
            echo ""
            echo 'After reviewing the diff and trace, a repository maintainer can comment `/maida accept [optional reason]` on this PR.'
            echo ""
          fi
          echo "<details>"
          echo "<summary><i>Reproducibility Instructions</i></summary>"
          echo ""
          echo "The \`maida view <id>\` command in this report refers to this CI job's trace store. That ID is not available on your machine until you record a local run."
          echo ""
          echo "From this PR checkout, record a fresh local run and rerun the same assertion inputs:"
          echo ""
          echo '```bash'
          if [[ "$MAIDA_VERSION" == "@"* ]]; then
            printf "python -m pip install %q\n" "git+https://github.com/maida-ai/maida.git${MAIDA_VERSION}"
          elif [[ "$MAIDA_VERSION" == "v"* ]]; then
            printf "python -m pip install %q\n" "maida-ai==${MAIDA_VERSION:1}"
          else
            printf "# Install Maida using the workflow version: %q\n" "$MAIDA_VERSION"
          fi
          if [ "$MODE" = "blocking" ]; then
            echo 'MAIDA_REPRO_DIR=$(mktemp -d)'
            printf 'git show %q > "$MAIDA_REPRO_DIR/policy.yaml"\n' "$BASE_SHA:$POLICY"
            if [ -n "$BASELINE" ]; then
              printf 'git show %q > "$MAIDA_REPRO_DIR/baseline.json"\n' "$BASELINE_REVISION:$BASELINE"
            fi
          fi
          if [ -n "$AGENT_SCRIPT" ]; then
            printf "maida run %q" "$AGENT_SCRIPT"
          else
            echo "# Run the trace-command configured in the workflow with equivalent environment variables."
            printf "maida assert"
          fi
          if [ "$MODE" = "blocking" ]; then
            if [ -n "$BASELINE" ]; then
              printf ' --baseline "$MAIDA_REPRO_DIR/baseline.json"'
            fi
            printf ' --policy "$MAIDA_REPRO_DIR/policy.yaml"'
          else
            if [ -n "$BASELINE" ]; then
              printf " --baseline %q" "$BASELINE"
            fi
            if [ -n "$POLICY" ]; then
              printf " --policy %q" "$POLICY"
            fi
          fi
          if [ -n "$EXTRA_ARGS" ]; then
            printf " %s" "$EXTRA_ARGS"
          fi
          printf "\n"
          echo '```'
          echo ""
          echo "Then run \`maida view <local-id>\` using the ID produced by your local run."
          if [ -n "$BASELINE" ]; then
            echo ""
            echo "If the local behavior change is intentional, accept it explicitly and review the baseline diff:"
            echo ""
            echo '```bash'
            printf "maida diff <local-id> --baseline %q\n" "$BASELINE"
            printf "maida view <local-id>\n"
            printf "maida accept <local-id> --baseline %q --reason %q\n" "$BASELINE" "why this behavior is expected"
            printf "git diff -- %q\n" "$BASELINE"
            echo '```'
          fi
          echo "</details>"
          echo ""
        } >> maida-report.md

    - name: Show PR comment in the action log
      shell: bash
      run: |
        cat maida-report.md

    - name: Publish Maida statistical gate check
      id: publish-check
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api \
          --method POST \
          --header "Accept: application/vnd.github+json" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          "repos/$GITHUB_REPOSITORY/check-runs" \
          --input maida-check-payload.json

    - name: Warn when check publication is unavailable
      if: steps.publish-check.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Could not publish the 'Maida statistical gate' check. Blocking mode will fail this job. Read-only/fork tokens cannot publish merge authorization; see README permissions and required-check setup."

    - name: Post PR comment if possible
      if: ${{ inputs.post-comment == 'true' && github.event_name == 'pull_request' }}
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
      with:
        path: maida-report.md

    - name: Fail if assertions failed
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        CONCLUSION: ${{ steps.check.outputs.conclusion }}
        PUBLICATION: ${{ steps.publish-check.outcome }}
      run: |
        if [ "$MODE" = "blocking" ] && { [ "$CONCLUSION" != "success" ] || [ "$PUBLICATION" != "success" ]; }; then
          echo "Maida blocking evaluation did not authorize this commit. Review the verdict, configuration acceptance, and check publication above."
          exit 1
        fi
